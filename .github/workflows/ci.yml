name: ci
on: [push]
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - run: just check
  boot:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, arch: x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@just
      - run: sudo chmod 666 /dev/kvm
      - uses: actions/cache@v4
        with:
          path: ~/.thanatos/images
          key: image-desktop-${{ matrix.arch }}-${{ hashFiles('image/**', 'crates/guest/**') }}
      - run: test -f ~/.thanatos/images/${{ matrix.arch }}/root.ext4 || just image ${{ matrix.arch }} desktop
      - run: just boot
