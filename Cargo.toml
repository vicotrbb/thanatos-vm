[workspace]
resolver = "3"
members = ["crates/hv", "crates/vmm", "crates/net", "crates/cli", "crates/guest"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/vicotrbb/thanatos-vm"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
lto = true
strip = true
panic = "abort"
