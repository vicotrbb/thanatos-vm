[package]
name = "thanatos-vmm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The Thanatos machine: boot loaders, virtio devices, display, control API"

[lints]
workspace = true

[dependencies]
thanatos-hv = { path = "../hv" }
thanatos-net = { path = "../net" }
vm-memory = { version = "0.18", features = ["backend-mmap"] }
virtio-queue = "0.18"
vm-fdt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"
winit = "0.30"
softbuffer = "0.4"

[dev-dependencies]
virtio-queue = { version = "0.18", features = ["test-utils"] }
virtio-bindings = "0.2"
